version: 2
registries:
  github-packages:
    type: maven-repository
    url: https://maven.pkg.github.com/navikt/sif-tilgangskontroll
    username: x-access-token
    password: ${{secrets.READER_TOKEN}}

  ghcr:
    type: docker-registry
    url: ghcr.io
    username: x-access-token
    password: ${{secrets.READER_TOKEN}}

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    groups:
      github:
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude:
        - "no.nav.*"
    registries:
      - github-packages
    ignore:
      # Versjonen følger sif-tilgangskontroll `core`, som er bygd mot graphql-kotlin 8.x
      - dependency-name: "com.expediagroup:graphql-kotlin-*"
        update-types: ["version-update:semver-major"]
    groups:
      spring-deps:
        patterns:
          - "org.springframework*"
      nav-deps:
        patterns:
          - "no.nav*"
      gradle:
        patterns:
          - "*"
        exclude-patterns:
          - "org.springframework*"
          - "no.nav*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: daily
    registries:
      - ghcr
