apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{app}}-alerts
  labels:
    team: {{team}}
  namespace: {{namespace}}
spec:
  groups:
    - name: {{app}}-alerts
      rules:
        - alert: Applikasjon nede
          expr: kube_deployment_status_replicas_available{deployment="{{app}}"} == 0
          for: 5m
          annotations:
            consequence: Ingen oppslag av søker, barn eller arbeidsgivere.
            action: "`kubectl describe pod <podname>` -> `kubectl logs <podname>`"
            summary: "App \{{ $labels.deployment }} er nede i namespace \{{ $labels.namespace }}"
          labels:
            namespace: {{namespace}}
            severity: danger

        - alert: Høy andel error i logger
          expr: sum by (app, container, pod, namespace) (floor(increase(logback_events_total{app="{{app}}", level="error"} [3m]))) > 0
          for: 5m
          annotations:
            action: "`kubectl logs \{{ $labels.pod }} -c \{{ $labels.container }} -n \{{ $labels.namespace }}`"
            summary: "Høy andel error i logger for app \{{ $labels.app }} feiler med \{{ $labels.exception }} i namespace \{{ $labels.namespace }}"
          labels:
            namespace: {{namespace}}
            severity: danger

        - alert: Høy andel warning i logger
          expr: sum by (app, container, pod, namespace) (floor(increase(logback_events_total{app="{{app}}", level="warn"} [3m]))) > 0
          for: 5m
          annotations:
            action: "`kubectl logs \{{ $labels.pod }} -c \{{ $labels.container }} -n \{{ $labels.namespace }}`"
            summary: "Høy andel warning i logger for app \{{ $labels.app }} feiler med \{{ $labels.exception }} i namespace \{{ $labels.namespace }}"
          labels:
            namespace: {{namespace}}
            severity: warning

        - alert: Høy andel HTTP serverfeil (5xx responser)
          expr: sum by (app, pod, namespace, method, uri, status) (floor(increase(http_server_requests_seconds_count{app="{{app}}", status=~"5.."}[3m]))) > 1
          for: 1m
          annotations:
            summary: "Følgende request feilet: `Status \{{ $labels.status }} - \{{ $labels.method }} \{{ $labels.uri }}`.\n
                          Sjekk loggene for å se hvorfor dette feiler."
            action: "`kubectl logs \{{ $labels.pod }} -n \{{ $labels.namespace }}`"
          labels:
            namespace: {{namespace}}
            severity: danger

        - alert: Høy andel HTTP klientfeil (4xx responser)
          expr: sum by (app, pod, namespace, method, uri, status) (floor(increase(http_server_requests_seconds_count{app="{{app}}", status=~"4..", status!~"401|403|404|451"}[3m]))) > 0
          for: 1m
          annotations:
            summary: "Følgende request feilet: `Status \{{ $labels.status }} - \{{ $labels.method }} \{{ $labels.uri }}`.\n
                          Sjekk loggene for å se hvorfor dette feiler"
            action: "`kubectl logs \{{ $labels.pod }} -n \{{ $labels.namespace }}`"
          labels:
            namespace: {{namespace}}
            severity: danger
