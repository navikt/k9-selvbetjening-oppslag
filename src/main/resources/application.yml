server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    # Konsumentene sender rå [] og {} i query (f.eks. a=arbeidsgivere[].organisasjoner[]...)
    relaxed-query-chars: "[,],{,},|"

spring:
  application:
    name: k9-selvbetjening-oppslag
  lifecycle:
    timeout-per-shutdown-phase: 20s
  http:
    clients:
      connect-timeout: 15s
      read-timeout: 15s

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: prometheus
      path-mapping:
        prometheus: metrics
  metrics:
    tags:
      app: k9-selvbetjening-oppslag

nav:
  register-urls:
    arbeidsgiver-og-arbeidstaker-v2: ${ARBEIDSGIVER_OG_ARBEIDSTAKER_V2_URL}
    enhetsregister-v1: ${ENHET_V1_URL}
    pdl-url: ${PDL_URL}

no.nav.security.jwt:
  issuer:
    tokenx:
      discoveryurl: ${TOKEN_X_WELL_KNOWN_URL}
      accepted_audience: ${TOKEN_X_CLIENT_ID}
    azure:
      discoveryurl: ${AZURE_APP_WELL_KNOWN_URL}
      accepted_audience: ${AZURE_APP_CLIENT_ID}

  client:
    registration:
      tokenx-pdl-api:
        token-endpoint-url: ${TOKEN_X_TOKEN_ENDPOINT}
        grant-type: urn:ietf:params:oauth:grant-type:token-exchange
        authentication:
          client-auth-method: private_key_jwt
          client-id: ${TOKEN_X_CLIENT_ID}
          client-jwk: ${TOKEN_X_PRIVATE_JWK}
        token-exchange:
          audience: ${PDL_API_TOKENX_AUDIENCE}

      tokenx-aareg:
        token-endpoint-url: ${TOKEN_X_TOKEN_ENDPOINT}
        grant-type: urn:ietf:params:oauth:grant-type:token-exchange
        authentication:
          client-auth-method: private_key_jwt
          client-id: ${TOKEN_X_CLIENT_ID}
          client-jwk: ${TOKEN_X_PRIVATE_JWK}
        token-exchange:
          audience: ${AAREG_TOKENX_AUDIENCE}

      azure-pdl-api:
        token-endpoint-url: ${AZURE_OPENID_CONFIG_TOKEN_ENDPOINT}
        grant-type: client_credentials
        scope: ${PDL_API_AZURE_AUDIENCE}
        authentication:
          client-auth-method: private_key_jwt
          client-id: ${AZURE_APP_CLIENT_ID}
          client-jwk: ${AZURE_APP_JWK}
